<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能动作预览</title><style>body{margin:0;background:#142326;color:#ede4c6;font:16px system-ui;text-align:center}h1{font-size:24px;color:#ead18e}button{background:#274549;color:#ede4c6;border:1px solid #bda36a;padding:12px 22px;margin:6px;cursor:pointer}button.active{background:#53695d}main{display:flex;flex-wrap:wrap;justify-content:center;gap:30px}.card{padding:18px;background:#1c3034;border:1px solid #667a73}.stage{width:384px;height:384px;max-width:80vw;background:linear-gradient(#263d41,#3c504a);position:relative;overflow:hidden}.sprite{width:100%;height:100%;background-size:800% 300%;background-repeat:no-repeat;image-rendering:pixelated}.caption{padding:10px;color:#c9d5c8}p{color:#bbc9c2}</style><h1>男女主 · 技能动作预览</h1><p>选择动作查看起手、施放与收势。每组8帧，动作结束后短暂停留。</p><nav><button class="active" data-row="0">攻击</button><button data-row="1">吟唱</button><button data-row="2">护盾</button><button id="pause">暂停</button></nav><main><section class="card"><h2>艾莉娅</h2><div class="stage"><div class="sprite" style="background-image:url(aelia-actions.png)"></div></div><div class="caption" id="female">蓄力 → 挥剑 → 剑光 → 收势</div></section><section class="card"><h2>陆川</h2><div class="stage"><div class="sprite" style="background-image:url(luchuan-actions.png)"></div></div><div class="caption" id="male">蓄积言契 → 伸掌 → 符文冲击 → 收势</div></section></main><p>动作设计预览；尚未接入游戏中的技能施放。</p><script>let row=0,start=performance.now(),paused=false,pausedAt=0;const sprites=[...document.querySelectorAll('.sprite')];const captions=[['蓄力 → 挥剑 → 剑光 → 收势','蓄积言契 → 伸掌 → 符文冲击 → 收势'],['立剑 → 凝神 → 圣光聚集 → 收势','凝神 → 双手结印 → 符文聚集 → 收势'],['举盾 → 护壁形成 → 防御架势 → 收势','抬掌 → 共鸣护壁 → 防御维持 → 收势']];document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{row=+b.dataset.row;start=performance.now();if(paused)pausedAt=start;document.querySelectorAll('[data-row]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#female').textContent=captions[row][0];document.querySelector('#male').textContent=captions[row][1]});document.querySelector('#pause').onclick=e=>{paused=!paused;if(paused)pausedAt=performance.now();else start+=performance.now()-pausedAt;e.target.textContent=paused?'播放':'暂停'};function draw(t){let age=((paused?pausedAt:t)-start)%1400;let frame=age<200?0:age>=1000?7:Math.min(7,Math.floor((age-200)/100));sprites.forEach(s=>s.style.backgroundPosition=`${frame/7*100}% ${row/2*100}%`);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
