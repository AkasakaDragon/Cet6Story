<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>技能动作预览</title><style>body{margin:0;background:#142326;color:#ede4c6;font:16px system-ui;text-align:center}h1{font-size:24px;color:#ead18e}button{background:#274549;color:#ede4c6;border:1px solid #bda36a;padding:12px 22px;margin:6px;cursor:pointer}button.active{background:#53695d}main{display:flex;flex-wrap:wrap;justify-content:center;gap:30px}.card{max-width:calc(100vw - 44px);overflow-x:auto;padding:18px;background:#1c3034;border:1px solid #667a73}.stage{width:768px;height:384px;background:linear-gradient(#263d41,#3c504a);position:relative;overflow:hidden}.sprite{position:absolute;left:0;top:0;width:384px;height:384px;background-size:800% 300%;background-repeat:no-repeat;image-rendering:pixelated}.effect{position:absolute;inset:0;width:768px;height:384px;pointer-events:none;image-rendering:pixelated}.caption{padding:10px;color:#c9d5c8}p{color:#bbc9c2}</style><h1>男女主 · 技能动作预览</h1><p>人物大小保持原样，技能向前远距离延伸。选择动作查看起手、施放与收势。</p><nav><button class="active" data-row="0">攻击</button><button data-row="1">吟唱</button><button data-row="2">护盾</button><button id="pause">暂停</button></nav><main><section class="card"><h2>艾莉娅</h2><div class="stage"><div class="sprite" style="background-image:url(aelia-actions.png)"></div><canvas class="effect" width="768" height="384"></canvas></div><div class="caption" id="female">蓄力 → 挥剑 → 剑光 → 收势</div></section><section class="card"><h2>陆川</h2><div class="stage"><div class="sprite" style="background-image:url(luchuan-actions-forward.png)"></div><canvas class="effect" width="768" height="384"></canvas></div><div class="caption" id="male">蓄积言契 → 伸掌 → 符文冲击 → 收势</div></section></main><p>技能动作已接入游戏；本页用于单独预览。</p><script>let row=0,start=performance.now(),paused=false,pausedAt=0;const sprites=[...document.querySelectorAll('.sprite')];const effects=[...document.querySelectorAll(".effect")].map(c=>c.getContext("2d"));const captions=[['蓄力 → 挥剑 → 剑光 → 收势','蓄积言契 → 伸掌 → 符文冲击 → 收势'],['立剑 → 凝神 → 圣光聚集 → 收势','凝神 → 双手结印 → 符文聚集 → 收势'],['举盾 → 护壁形成 → 防御架势 → 收势','抬掌 → 共鸣护壁 → 防御维持 → 收势']];document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{row=+b.dataset.row;start=performance.now();if(paused)pausedAt=start;document.querySelectorAll('[data-row]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#female').textContent=captions[row][0];document.querySelector('#male').textContent=captions[row][1]});document.querySelector('#pause').onclick=e=>{paused=!paused;if(paused)pausedAt=performance.now();else start+=performance.now()-pausedAt;e.target.textContent=paused?'播放':'暂停'};function draw(t){let age=((paused?pausedAt:t)-start)%1400;let frame=age<200?0:age>=1000?7:Math.min(7,Math.floor((age-200)/100));sprites.forEach((s,i)=>{s.style.backgroundPosition=`${frame/7*100}% ${row/2*100}%`;s.style.clipPath=i===1&&row===0&&frame===5?"polygon(23% 0,100% 0,100% 100%,0 100%,0 52%,23% 52%)":"none"});effects.forEach((g,i)=>{g.clearRect(0,0,768,384);g.imageSmoothingEnabled=false;if(row!==0||age<600||age>1000)return;let progress=Math.max(0,Math.min(1,(age-600)/330));let x=320+progress*370,y=i===1?141:161;let fade=Math.min(1,(1000-age)/120);g.globalAlpha=Math.max(0,fade);const palette=i===1?["#356979","#65b4c8","#d0f0ed"]:["#80704d","#cfb773","#f0e4b2"];for(let j=0;j<3;j++){g.fillStyle=palette[j];let h=(3-j)*6;let tail=95-j*18;for(let k=0;k<tail;k+=4){let half=Math.max(2,h*(1-k/tail));g.fillRect(Math.round((x-k)/4)*4,Math.round((y-half)/4)*4,4,Math.max(4,Math.round(half*2/4)*4))}for(let k=0;k<24-j*6;k+=4){let half=h*(1-k/24);g.fillRect(Math.round((x+k)/4)*4,Math.round((y-half)/4)*4,4,Math.max(4,Math.round(half*2/4)*4))}}for(let k=0;k<6;k++){let px=x-30-k*12,py=y+(k%2===0?1:-1)*(8+k*3);g.fillStyle=palette[1];g.fillRect(Math.round(px/4)*4,Math.round(py/4)*4,4,4)}g.globalAlpha=1;});requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
