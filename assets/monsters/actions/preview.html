<!doctype html><html lang="zh"><meta charset="utf-8"><title>怪物攻击与受击动作预览</title><style>body{margin:0;background:#101e25;color:#e6dcc1;font:16px system-ui}header{padding:20px}button{padding:10px 20px;margin:5px;background:#213943;color:#edd596;border:1px solid #ab9158}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(550px,1fr));gap:12px;padding:20px}article{background:#192c32;padding:12px}canvas{width:100%;image-rendering:pixelated}small{color:#b1c2bf}</style><header><h2>剧毒林地 · 怪物动作预览</h2><button onclick="mode='attack'">攻击循环</button><button onclick="mode='hit'">受击循环</button><button onclick="paused=!paused">暂停 / 播放</button><p>怪物身体与技能分层绘制；特效向左延伸，怪物大小保持一致。</p></header><main id="cards"></main><script>
const names=['荆棘孢子兽 · 战士','苔冠浮灵 · 坦克','灯笼菌蛾 · 法师','合唱伞灵 · 吟游诗人','鼓腹炮菇蟾 · 炮手'];let mode='attack',paused=false,time=0,last=0;const image=new Image;image.src='monster-actions-v2.png';const cards=names.map((name,i)=>{let a=document.createElement('article');a.innerHTML='<b>'+name+'</b><br><small>蓄势 → 出击 → 收招 / 受击 → 后仰 → 恢复</small><canvas width="720" height="330"></canvas>';document.querySelector('main').appendChild(a);return a.querySelector('canvas')});function pixel(g,x,y,color,size=4){g.fillStyle=color;g.fillRect(Math.round(x/3)*3,Math.round(y/3)*3,size,size)}function draw(ts){if(!paused)time+=(ts-last||0);last=ts;let t=(time%1800)/1800;cards.forEach((c,row)=>{let g=c.getContext('2d');g.imageSmoothingEnabled=false;g.clearRect(0,0,720,330);g.fillStyle='#243a3e';g.fillRect(0,295,720,3);let frame=mode==='hit'?(t<.15?0:t<.48?4:t<.72?5:0):(t<.16?0:t<.35?1:t<.57?2:t<.8?3:0);if(image.complete&&image.naturalWidth){let edges=[0,230,477,686,910,1145],w=image.width/6,top=edges[row]*image.height/1145,h=(edges[row+1]-edges[row])*image.height/1145;g.drawImage(image,frame*w,top,w,h,420,15,285*w/h,285)}if(mode==='attack'&&t>.35&&t<.8){let p=(t-.35)/.45,x=460-p*380,y=155,col=['#bfa781','#b6beac','#9c8dbb','#a9cbb3','#cfad73'][row];if(row===3){for(let j=0;j<4;j++){let xx=440-p*280-j*25,yy=155+Math.sin(p*8+j)*30;pixel(g,xx,yy,col,6);pixel(g,xx+6,yy-12,col,3);pixel(g,xx+6,yy+12,col,3)}}else{for(let j=0;j<12;j++)pixel(g,x+j*8,y+Math.sin(j+p*14)*5,col,j<3?9:3);for(let j=0;j<6;j++)pixel(g,x+30+j*9,y+(j%2?1:-1)*(10+j*3),col,3)}if(p>.8)for(let j=0;j<12;j++){let r=(p-.8)*220,a=j*2.399;pixel(g,80+Math.cos(a)*r,155+Math.sin(a)*r,col,5)}}if(mode==='hit'&&t>.15&&t<.45){let p=(t-.15)/.3;for(let j=0;j<10;j++){let a=j*2.399;pixel(g,505+Math.cos(a)*p*50,170+Math.sin(a)*p*50,'#dcc3aa',4)}if(p<.2){g.fillStyle='#eadcb8';g.fillRect(495,147,3,35);g.fillRect(480,163,35,3)}}});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
